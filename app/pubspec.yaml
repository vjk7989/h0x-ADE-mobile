name: hyperox
description: HyperOx mobile. Your computer's agents and terminals, from your phone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Every MVP dependency is declared here once; after this nobody edits this file.
# Firebase packages (firebase_core, firebase_auth, cloud_firestore,
# firebase_messaging, google_sign_in) are left out of the first, SSH-only
# build (prerequisites P2/P4 are not done). They come back with account mode.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  xterm: ^4.0.0
  dartssh2: 4.1.0
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # Geist (UI) and JetBrains Mono (terminal, codes, keys): both SIL OFL,
  # copied from the desktop app's assets/fonts. Variable fonts: weights are
  # set with FontVariation('wght') in lib/theme/type.dart.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
