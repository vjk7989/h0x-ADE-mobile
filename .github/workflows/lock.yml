name: lock

# Generates app/pubspec.lock (no Flutter needed locally) and uploads it as
# the `pubspec-lock` artifact. Run it from the Actions tab, or touch
# app/LOCK-REGENERATE on a branch to run it on push. Commit the artifact
# to app/pubspec.lock.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lock.yml'
      - 'app/LOCK-REGENERATE'

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pubspec-lock
          path: app/pubspec.lock
          if-no-files-found: error
