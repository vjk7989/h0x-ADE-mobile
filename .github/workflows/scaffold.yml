name: scaffold

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: Generate the Flutter scaffold
        run: flutter create --org tech.pavii --project-name hyperox --platforms android --android-language kotlin app
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: scaffold
          commit-message: "chore: flutter scaffold"
          title: "chore: flutter scaffold"
          body: "Generated by the scaffold workflow (flutter create, Flutter 3.50.0)."
          add-paths: app
